onboarding = false

[ui]
# Ghostty's tab shows the focused pane's own title, as it did before herdr
window_title = "{workspace}: {terminal_title}"
# Agent states as colored dots (the default; "symbols" uses shapes instead)
status_indicators = "dots"

# Tell me when an agent finishes or needs input with a popup inside herdr
# (off by default). prefix+o jumps to the notified pane.
[ui.toast]
delivery = "herdr"

# Show what Claude Code is working on (its terminal title) under each agent.
# A pane named with a leading "*" or "!" (prefix+shift+p) marks an agent in use,
# so it stands out among agents left idle for a while.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "agent", "state_text", { token = "pane", rules = [{ starts_with = "*", fg = "#e5c07b", bold = true }, { starts_with = "!", fg = "#e5c07b", bold = true }] }],
  ["terminal_title_stripped"],
]
