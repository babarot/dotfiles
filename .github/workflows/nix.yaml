# Checks formatting and evaluates both Macs' configurations, so a change
# for one Mac is known to evaluate before anyone switches. Building them
# is left to .githooks/pre-push: a fresh runner downloads and builds
# everything again (~15 min), while a local store already has almost all
# of it, and the local build sees the real private inputs. agent-skills and
# claude-recap are private inputs CI cannot fetch; stubs made in the job
# stand in for them.
name: nix

on:
  push:
    branches: [main]
    paths: &paths
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'home/skills/**' # nix/home-manager/skills.nix reads the directory
      - '**.sh' # shfmt in nix flake check
      - '**.bash'
      - '.github/workflows/nix.yaml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
      # nix/home-manager/tools/agent-skills.nix only lists the directories under
      # plugins/<scope>/skills, so empty ones evaluate; it also installs
      # nix/writing-tools, which an empty derivation stands in for
      - run: |
          stub=$RUNNER_TEMP/agent-skills-stub
          mkdir -p "$stub"/plugins/{core,work}/skills "$stub"/nix/writing-tools
          echo '{ runCommand }: runCommand "writing-tools-stub" { } "mkdir $out"' >"$stub"/nix/writing-tools/default.nix
          echo "STUB=path:$stub" >>"$GITHUB_ENV"
      # nix/home-manager/tools/claude-recap.nix only takes packages.<system>.default;
      # the stub declares nixpkgs so the flake's `follows` has an input to set
      - run: |
          stub=$RUNNER_TEMP/claude-recap-stub
          mkdir -p "$stub"
          cat >"$stub"/flake.nix <<'NIX'
          {
            inputs.nixpkgs.url = "github:NixOS/nixpkgs/nixpkgs-unstable";
            outputs = { nixpkgs, ... }: {
              packages = nixpkgs.lib.genAttrs [ "aarch64-darwin" "x86_64-darwin" ] (system: {
                default = nixpkgs.legacyPackages.${system}.runCommand "claude-recap-stub" { } "mkdir $out";
              });
            };
          }
          NIX
          echo "RECAP_STUB=path:$stub" >>"$GITHUB_ENV"
      - run: nix flake check --override-input agent-skills "$STUB" --override-input claude-recap "$RECAP_STUB"
      # flake check does not know darwinConfigurations; evaluating each
      # system's derivation catches wrong options and host-only breakage.
      # Hosts come from the flake, so a new Mac needs no change here.
      - run: |
          stub=(--override-input agent-skills "$STUB" --override-input claude-recap "$RECAP_STUB")
          hosts=$(nix eval --raw .#darwinConfigurations "${stub[@]}" \
            --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)')
          for host in $hosts; do
            echo "::group::$host"
            nix eval --raw ".#darwinConfigurations.$host.system.drvPath" "${stub[@]}"
            echo
            echo "::endgroup::"
          done
