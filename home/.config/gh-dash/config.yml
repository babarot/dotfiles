# gh-dash: https://gh-dash.dev/configuration/
# gh-news stays on screen to catch new notifications; this is for working
# on PRs and issues, so it opens on the PRs view.

prSections:
  # PRs waiting on my approval. A search, not the notification inbox, so a
  # PR drops out once someone approves it (review:approved), it is merged
  # or closed, or I review it (GitHub then drops the request)
  - title: To Review
    filters: >-
      is:open review-requested:@me -review:approved
      -is:draft -author:app/renovate
  - title: My PRs
    filters: is:open author:@me
  # Look, v to approve, m to merge; both ask before acting
  - title: Renovate
    filters: is:open author:app/renovate review-requested:@me
  - title: Involved
    filters: >-
      is:open involves:@me -author:@me
      updated:>={{ nowModify "-2w" }}
  - title: Recently Merged
    filters: >-
      is:merged author:@me
      merged:>={{ nowModify "-1w" }}
    layout:
      ci:
        hidden: true

# The work Mac replaces these with its own list in work.yml; keep the two
# in step
issuesSections:
  # Every open issue I filed, most recently updated first
  - title: My Issues
    filters: is:open author:@me
    limit: 50
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: >-
      is:open involves:@me -author:@me
      updated:>={{ nowModify "-2w" }}

notificationsSections:
  # New activity on threads I filed or joined; Enter marks one read and it
  # drops out. PRs show up here too: notification filters have no type
  - title: New Activity
    filters: is:unread reason:author reason:comment reason:mention
  - title: Participating
    filters: reason:participating
  - title: Review Requested
    filters: reason:review-requested
  - title: Mentioned
    filters: reason:mention reason:team-mention

defaults:
  view: prs
  prsLimit: 30
  issuesLimit: 30
  refetchIntervalMinutes: 5
  preview:
    open: true
    width: 0.5

# Same layout as ghq's root, so C (checkout) finds any cloned repo
repoPaths:
  :owner/:repo: ~/src/github.com/:owner/:repo

pager:
  diff: delta

# Unread only, as in gh-news with show_read = false
includeReadNotifications: false

keybindings:
  # g is firstLine, so lazygit goes on ctrl+g
  universal:
    - key: ctrl+g
      name: lazygit
      command: cd {{.RepoPath}} && lazygit
  # Enter opens in the browser, like o. A custom command, since rebinding
  # the openGithub builtin to enter would take it off o
  prs:
    - key: enter
      name: open in browser
      command: open https://github.com/{{.RepoName}}/pull/{{.PrNumber}}
    - key: O
      name: open in nvim
      command: cd {{.RepoPath}} && gh pr checkout {{.PrNumber}} && nvim .
  issues:
    - key: enter
      name: open in browser
      command: open https://github.com/{{.RepoName}}/issues/{{.IssueNumber}}
