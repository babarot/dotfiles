#:schema https://raw.githubusercontent.com/babarot/gh-desk/main/docs/config.schema.json

[[tabs]]
name = "review"
query = "is:open is:pr review-requested:@me archived:false"
sections = [
  { bot = false, name = "requested from you", requested = ["me"] },
  { bot = false, name = "requested from a team", requested = ["@*"], show = "folded" },
  { bot = false, name = "other" },
  { bot = true, name = "bots", show = "folded" },
]

[[tabs]]
name = "mine"
query = "is:open is:pr author:@me archived:false"
sections = [
  { draft = false },
  { draft = true },
]

[[tabs]]
name = "involved"
query = "is:open is:pr involves:@me -author:@me -review-requested:@me archived:false"

[[tabs]]
kind = "inbox"
name = "inbox"
sections = [
  { name = "review requests", reasons = ["review_requested"] },
  { name = "mentions", reasons = ["mention"] },
]
show_settled = false

[[select]]
max_lines = 300
name = "small"

[[select]]
authors = ["renovate", "dependabot"]
checks = ["passing"]
name = "dependency bots"

[[select]]
approved_by_me = true
name = "approved"

[[select]]
name = "recent"
updated_within_days = 90

[[select]]
authors = ["renovate"]
name = "lock files"
title = "(?i)lock file maintenance"

[[exclude]]
repos = ["mercari/*", "zplug/*", "goccy/*", "vimeejs/*"]

[[exclude]]
checks = ["passing"]
decision = ["approved"]
state = ["merged", "closed"]

[[exclude]]
title = "^Update Helm release"

[[exclude]]
title = "^Lock file maintenance"

[[exclude]]
title = "update helm release datadog"

[[exclude]]
authors = ["renovate"]
title = "update terraform"

[[exclude]]
authors = ["renovate"]
title = "pin dependencies"

[[exclude]]
authors = ["renovate"]
title = "lock file maintenance"

[[exclude]]
authors = ["renovate"]
title = "Pin dependencies"

[[exclude]]
created_before_days = 120
updated_before_days = 60

[[exclude]]
title = "Configure Renovate"

[[auto_approve]]
authors = ["renovate"]
dry_run = false
repos = ["*/renovate-config", "*/gh-audit", "*/security-tools"]

[list]
scope = "owner"

[claude]
language = "Japanese"

[claude.mcp]
builtin = true
servers = { recall = { args = ["mcp", "--repo", "${GH_DESK_URL}"], command = "recall", tools = ["recall_search", "recall_list", "recall_export"] } }
