auto_refresh_interval = 30
show_read = false
theme = "tokyo_night"
# Start with every group folded, as after H (a local patch)
groups_collapsed = true

# What the built-in Participating view hides, applied by default since
# there is no setting for the view to start in
exclude_reasons = ["subscribed", "ci_activity"]

# Hide review requests once nobody needs my review (a local patch)
hide_resolved_review_requests = ["merged", "closed", "approved"]

# x then 1 approves; merge with the built-in m, which refuses drafts and
# stale previews and asks first. show_output so a failed approve is seen
[[actions]]
name = "Approve"
command = "gh pr review {number} -R {full_name} --approve"
priority = 1
show_output = true

[[actions]]
name = "Copy URL"
command = "echo {url} | pbcopy"
