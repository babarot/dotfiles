onboarding = false

[ui]
# Ghostty's tab shows the focused pane's own title, as it did before herdr
window_title = "{workspace}: {terminal_title}"
# Agent states as shapes, not colored dots (the default), so they differ without color
status_indicators = "symbols"
# Right end of the tab bar: ZOOM while a pane is zoomed, the focused pane's
# git branch (one worktree goes through several PR branches), and the time
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = 'git -C "${HERDR_ACTIVE_PANE_CWD:-.}" branch --show-current 2>/dev/null', interval_seconds = 2, timeout_seconds = 1 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

# Tell me when an agent finishes or needs input with a popup inside herdr
# (off by default). prefix+a jumps to the notified pane (herdr's default
# prefix+o is taken by pane cycling below).
[ui.toast]
delivery = "herdr"

# Show what Claude Code is working on (its terminal title) under each agent.
# A pane named with a leading "*" or "!" (prefix+shift+p) marks an agent in use,
# so it stands out among agents left idle for a while.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "agent", "state_text", { token = "pane", rules = [{ starts_with = "*", fg = "#e5c07b", bold = true }, { starts_with = "!", fg = "#e5c07b", bold = true }] }],
  ["terminal_title_stripped"],
  # Off with nix/home-manager/tools/herdr-activity.nix; uncomment to turn it back on.
  # The latest tool call, reported by nix/home-manager/tools/herdr-activity.sh. The
  # tool name starts with an invisible mark of its kind that picks the colour:
  # edit, shell, read, agent, web, task/skill, mcp (tokyo-night colours).
  # While the agent is idle, herdr-activity-idle.sh puts U+FEFF in front, and
  # the first rule (first match wins) dims it instead.
  # [
  #   { token = "$activity_time", dim = true },
  #   { token = "$activity_tool", fg = "#565f89", rules = [
  #     { contains = "﻿", dim = true },
  #     { contains = "\u2060", fg = "#e0af68" },
  #     { contains = "\u2061", fg = "#9ece6a" },
  #     { contains = "\u2062", fg = "#7aa2f7" },
  #     { contains = "\u2063", fg = "#bb9af7" },
  #     { contains = "\u2064", fg = "#7dcfff" },
  #     { contains = "\u200B", fg = "#ff9e64" },
  #     { contains = "\u200C", fg = "#f7768e" },
  #   ] },
  #   "$activity_label",
  # ],
]

# A worktree space named for what it is for (the name field of the new
# worktree dialog, or prefix+shift+w later) reads its name, then its branch,
# which follows every checkout, then its worktree dir, which other sessions go
# by. `worktree`, the name field and the branch on named worktree spaces come
# from the patches in nix/home-manager/tools/herdr.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "worktree", dim = true }],
]

# Same prefix as tmux had; pressing it twice sends a literal ctrl+s
# (Claude Code's prompt stash, saving a hunk or tuicr comment).
[keys]
prefix = "ctrl+s"
# prefix+o goes to the other pane, or the next one in order with three or
# more, as it did in tmux
cycle_pane_next = "prefix+o"
open_notification_target = "prefix+a"

# Review plugins from nix/home-manager/tools/herdr-reviewr.nix and herdr-hunk-diff.nix.
# The hunk keys are the ones its setup-keys action would add.
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle pane"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"
